name: AmigaOS4/AROS/MorphOS release build

on:
  push:
    tags:
      - '[0-9]*'
  workflow_dispatch:

jobs:
  build:
    name: MUI - ${{ matrix.platform.name }}
    runs-on: ubuntu-latest

    strategy:
      matrix:
        platform:
          - name: AmigaOS4
            image: rolfkopman/os4env
            mount: /opt/code
          - name: AROS i386 ABI V0
            image: rolfkopman/arosi386v0env
            mount: /opt/code
          - name: AROS x86_64 ABI V1
            image: rolfkopman/arosx64v1env
            mount: /opt/code
          - name: MorphOS
            image: rolfkopman/mosenv
            mount: /gg/code

    steps:
    - name: Checkout code
      uses: actions/checkout@v5

    - name: Compile Installer
      run: |
        git clone --depth=1 https://github.com/sodero/InstallerLG.git
        docker run --rm \
          -v ${{ github.workspace }}:${{ matrix.platform.mount }} \
          -w ${{ matrix.platform.mount }} \
          ${{ matrix.platform.image }} make -C InstallerLG/build && \
          cp InstallerLG/build/Installer dist/extras/$(uname)
          find dist

    - name: Compile
      run: |
        docker run --rm \
          -v ${{ github.workspace }}:${{ matrix.platform.mount }} \
          -w ${{ matrix.platform.mount }} \
          -e BUILD=mui \
          ${{ matrix.platform.image }} make dist

