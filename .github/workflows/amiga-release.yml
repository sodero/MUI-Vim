name: AmigaOS4/AROS/MorphOS release build

on:
  push:
    tags:
      - '[0-9]*'
  workflow_dispatch:

jobs:
  build:
    name: MUI - ${{ matrix.platform.name }}
    runs-on: ubuntu-latest

    strategy:
      matrix:
        platform:
          - name: AROS i386 ABI V0
            image: rolfkopman/arosi386v0env
            mount: /opt/code
          - name: MorphOS
            image: rolfkopman/mosenv
            mount: /gg/code
          - name: AmigaOS4
            image: rolfkopman/os4env
            mount: /opt/code

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Compile
      run: |
        docker run --rm \
          -v ${{ github.workspace }}:${{ matrix.platform.mount }} \
          -w ${{ matrix.platform.mount }} \
          -e BUILD=mui \
          ${{ matrix.platform.image }} make dist

    - name: Publish release
      uses: softprops/action-gh-release@v2
      if: startsWith(github.ref, 'refs/tags/')
      with:
        files: dist/tmp/*
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
